<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mê Đồ Hay - Tạm bảo trì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #FF8233, #FDAC55);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== BACKGROUND MDH TEXT ===== */
    .bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.8;
      z-index: 1;
      mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-text-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-text {
      color: #FFFFFF;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      white-space: nowrap;
      font-size: clamp(180px, 42vw, 720px);
      transform-origin: center;
      user-select: none;
    }
    .bg-oval {
      position: absolute;
      background: #FFFFFF;
      border-radius: 9999px;
      width: clamp(120px, 20vw, 400px);
      height: 22vh;
      transform-origin: center;
    }
    @media (min-width: 640px) {
      .bg-oval { height: 26vh; }
    }
    @media (min-width: 768px) {
      .bg-oval { height: 50vh; }
    }

    /* ===== TOP BAR ===== */
    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px;
    }
    @media (min-width: 640px) {
      .topbar { padding: 20px 24px; }
    }
    @media (min-width: 768px) {
      .topbar { padding: 20px 48px; }
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
    }
    @media (min-width: 640px) {
      .dot { width: 12px; height: 12px; }
    }
    .logo-text {
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin-left: 4px;
    }
    @media (min-width: 640px) {
      .logo-text { font-size: 20px; }
    }

    /* ===== CENTER VIDEO ===== */
    .video-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      margin-top: calc(-6vh - 40px);
    }
    .video-box {
      width: 120vw;
      height: 85vh;
    }
    @media (min-width: 640px) {
      .video-box {
        width: 70vw;
        height: 70vh;
      }
    }
    @media (min-width: 768px) {
      .video-box {
        width: 62vw;
        height: 78vh;
      }
    }
    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      mix-blend-mode: darken;
    }

    /* ===== BOTTOM CONTENT ===== */
    .bottom {
      position: relative;
      z-index: 30;
      margin-top: auto;
      padding-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-left: 16px;
      padding-right: 16px;
    }
    @media (min-width: 640px) {
      .bottom { padding-bottom: 64px; }
    }
    .bottom h1 {
      color: white;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    @media (min-width: 640px) {
      .bottom h1 { font-size: 20px; margin-bottom: 16px; }
    }
    @media (min-width: 768px) {
      .bottom h1 { font-size: 24px; }
    }
    .bottom .desc {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      line-height: 1.5;
      max-width: 420px;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 9999px;
      background: #F16524;
      color: white;
      font-weight: 600;
      font-size: 14
