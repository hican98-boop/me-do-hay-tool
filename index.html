<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mê Đồ Hay - Tạm bảo trì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #FF8233, #FDAC55);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Background MDH */
    .bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      opacity: 0.18;
      mask-image: linear-gradient(to bottom, black 30%, transparent 90%);
      -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 90%);
    }
    .bg span {
      font-weight: 900;
      font-size: clamp(160px, 40vw, 680px);
      color: white;
      letter-spacing: -0.06em;
      line-height: 0.85;
      white-space: nowrap;
      user-select: none;
    }

    /* Top bar */
    .topbar {
      position: relative;
      z-index: 20;
      padding: 18px 20px;
      display: flex;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
    }
    .logo-text {
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    /* Main content */
    .main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px 40px;
      text-align: center;
    }

    .fox {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.18));
      border-radius: 24px;
    }

    h1 {
      color: white;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .desc {
      color: rgba(255,255,255,0.95);
      font-size: 15px;
      line-height: 1.55;
      max-width: 400px;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: white;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    }
    .btn-fb { color: #1877F2; }
    .btn-zalo { color: #0068FF; }
    .btn svg { width: 18px; height: 18px; }

    .note {
      margin-top: 16px;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- Background MDH -->
  <div class="bg">
    <span>MDH</span>
  </div>

  <!-- Top -->
  <div class="topbar">
    <div class="logo">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <span class="logo-text">Mê Đồ Hay</span>
    </div>
  </div>

  <!-- Content -->
  <div class="main">
    <!-- Ảnh cáo (có thể thay bằng ảnh bạn thích) -->
    <img 
      class="fox" 
      src="https://cdn-icons-png.flaticon.com/512/616/616408.png" 
      alt="Fox"
      onerror="this.src='https://img.icons8.com/color/480/fox.png'"
    />

    <h1>Tool đang tạm bảo trì</h1>
    <p class="desc">
      Chúng tôi đang cập nhật theo chính sách mới của Shopee để bảo vệ tài khoản Affiliate.<br>
      Hiện tại chưa thể tự chuyển link.
    </p>

    <div class="buttons">
      <a class="btn btn-fb" href="https://www.facebook.com/medohaydeal/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Fanpage
      </a>
      <a class="btn btn-zalo" href="https://zalo.me/0827351354" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3 .97 4.29L2 22l5.71-.97C9 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.3 0-2.53-.3-3.63-.84l-.26-.15-2.72.46.46-2.72-.15-.26C5.3 14.53 5 13.3 5 12c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7z"/><circle cx="8.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="15.5" cy="12" r="1.2"/></svg>
        Zalo hỗ trợ
      </a>
    </div>

    <div class="note">Mình sẽ gửi link affiliate cho bạn nhanh nhất có thể</div>
  </div>
</body>
</html>
